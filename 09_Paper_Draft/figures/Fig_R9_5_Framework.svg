<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620"><rect width="1200" height="620" fill="#fff"/><text x="600" y="48" text-anchor="middle" font-family="Arial,sans-serif" font-size="28" font-weight="700" fill="#172B3A">R9.5 Sensitivity and comparison framework</text><text x="600" y="78" text-anchor="middle" font-family="Arial,sans-serif" font-size="15" fill="#647783">Inputs → harmonized two-stage GWP model → sensitivity, thresholds and separate battery module</text><g font-family="Arial,sans-serif"><rect x="55" y="130" width="290" height="365" rx="16" fill="#F2F6F8" stroke="#78909C" stroke-width="2"/><text x="200" y="165" text-anchor="middle" font-size="21" font-weight="700" fill="#294454">Input parameters</text><rect x="85" y="195" width="230" height="72" rx="10" fill="#fff" stroke="#A8BAC3"/><text x="200" y="224" text-anchor="middle" font-size="17" fill="#243B4A">2023 activity & energy</text><text x="200" y="247" text-anchor="middle" font-size="13" fill="#647783">R7 VKT, L/100 km, kWh/100 km</text><rect x="85" y="285" width="230" height="72" rx="10" fill="#fff" stroke="#A8BAC3"/><text x="200" y="314" text-anchor="middle" font-size="17" fill="#243B4A">Vehicle production</text><text x="200" y="337" text-anchor="middle" font-size="13" fill="#647783">Qiao kg CO₂e/vehicle</text><rect x="85" y="375" width="230" height="82" rx="10" fill="#fff" stroke="#A8BAC3"/><text x="200" y="405" text-anchor="middle" font-size="17" fill="#243B4A">Energy & battery factors</text><text x="200" y="428" text-anchor="middle" font-size="13" fill="#647783">Peng WTW; ICCT / Hao / Lai / Sun</text><rect x="430" y="180" width="340" height="270" rx="16" fill="#EAF5F3" stroke="#16877D" stroke-width="2.5"/><text x="600" y="220" text-anchor="middle" font-size="22" font-weight="700" fill="#17645E">Harmonized model</text><text x="600" y="275" text-anchor="middle" font-size="19" fill="#244D4A">GWP = manufacturing / lifetime</text><text x="600" y="307" text-anchor="middle" font-size="19" fill="#244D4A">+ energy WTW per vehicle-km</text><line x1="485" y1="335" x2="715" y2="335" stroke="#A6C8C3" stroke-width="1.5"/><text x="600" y="370" text-anchor="middle" font-size="16" fill="#244D4A">Sensitivity: grid factor × lifetime</text><text x="600" y="398" text-anchor="middle" font-size="16" fill="#244D4A">Break-even grid factor</text><path d="M345 315 H430" stroke="#536B78" stroke-width="3" fill="none"/><path d="M417 306 L430 315 L417 324" stroke="#536B78" stroke-width="3" fill="none"/><path d="M770 315 H850" stroke="#536B78" stroke-width="3" fill="none"/><path d="M837 306 L850 315 L837 324" stroke="#536B78" stroke-width="3" fill="none"/><rect x="850" y="130" width="295" height="365" rx="16" fill="#F8F4EE" stroke="#C29A6B" stroke-width="2"/><text x="997" y="165" text-anchor="middle" font-size="21" font-weight="700" fill="#74512E">Outputs</text><rect x="880" y="195" width="235" height="72" rx="10" fill="#fff" stroke="#D5B995"/><text x="997" y="225" text-anchor="middle" font-size="17" fill="#4D3B2B">Intensity curves</text><text x="997" y="247" text-anchor="middle" font-size="13" fill="#806C58">g CO₂e / vehicle-km</text><rect x="880" y="285" width="235" height="72" rx="10" fill="#fff" stroke="#D5B995"/><text x="997" y="315" text-anchor="middle" font-size="17" fill="#4D3B2B">Break-even threshold</text><text x="997" y="337" text-anchor="middle" font-size="13" fill="#806C58">kg CO₂e / kWh</text><rect x="880" y="375" width="235" height="82" rx="10" fill="#fff" stroke="#D5B995"/><text x="997" y="405" text-anchor="middle" font-size="17" fill="#4D3B2B">Battery-only module</text><text x="997" y="428" text-anchor="middle" font-size="13" fill="#806C58">reported separately, no double count</text></g><text x="600" y="565" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#647783">Post-competition MEE 2023 factors are retained as retrospective cross-checks, not strict contest-time inputs.</text></svg>